services:
  - type: web
    name: iara-backend
    env: node
    rootDirectory: backend
    plan: starter
    buildCommand: npm ci --only=production --no-audit --no-fund
    startCommand: node src/server.js
    healthCheckPath: /health
    minInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: Iara
      - key: ADMIN_PASS_HASH
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
        # IMPORTANTE: Crear un Vercel Blob Store en https://vercel.com/dashboard/stores
        # y pegar el token de read+write aquí. No uses generateValue porque requiere un token real.
      - key: SITE_URL
        value: https://artesania-gualeguay-v3.vercel.app
      - key: BACKEND_URL
        value: https://iara-os3h.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://artesania-gualeguay-v3.vercel.app,https://*.vercel.app,https://artesaniagualeguay.com,http://localhost:3000,http://localhost:5173
      - key: SHIPPING_COST
        value: "200"
      - key: SHIPPING_THRESHOLD
        value: "2000"
      - key: EMAIL_FROM
        value: noreply@artesaniagualeguay.com
      - key: ADMIN_NOTIFICATION_EMAIL
        value: admin@artesaniagualeguay.com
      - key: RESEND_API_KEY
        value: ""
        sync: false
      - key: REDIS_URL
        value: ""
        sync: false
      - key: WHATSAPP
        value: "+5493444634444"
      - key: LOG_LEVEL
        value: info
    autoDeploy: true
    branch: main
    repo: https://github.com/Lautarocolombo/IARA.git
