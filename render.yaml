services:
  - type: web
    name: iara-backend
    env: node
    rootDirectory: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: Iara
      - key: ADMIN_PASS_HASH
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://iara-eight.vercel.app,https://iara-ivory.vercel.app,https://iara-alpha.vercel.app,https://artesaniagualeguay.com,http://localhost:3000
      - key: DATABASE_URL
        value: from-dashboard
      - key: MP_ACCESS_TOKEN
        value: from-dashboard
    autoDeploy: true
    branch: main
    repo: https://github.com/bonggiocrack-stack/IARA.git
