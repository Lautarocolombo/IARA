services:
  - type: web
    name: iara-backend
    env: node
    rootDirectory: backend
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: Iara
      - key: ADMIN_PASS_HASH
        generateValue: true
      - key: ADMIN_PASS
        generateValue: true
      - key: DATABASE_URL
        generateValue: true
      - key: SITE_URL
        value: https://iara-lovat.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://iara-lovat.vercel.app,https://*.vercel.app,https://artesaniagualeguay.com,http://localhost:3000,http://localhost:3001
      - key: SHIPPING_COST
        value: "200"
      - key: SHIPPING_THRESHOLD
        value: "2000"
      - key: WHATSAPP
        value: "+5493444634444"
      # Cloudinary: configurar en Render Dashboard (Settings > Environment) con valores reales.
      # No uses generateValue: true para estas variables, requiere credenciales válidas de Cloudinary.
      # - CLOUDINARY_CLOUD_NAME: tu cloud name
      # - CLOUDINARY_API_KEY: tu api key
      # - CLOUDINARY_API_SECRET: tu api secret
      # Si no están configuradas, las imágenes se guardan localmente (efímero en Render).
    autoDeploy: true
    branch: main
    repo: https://github.com/Lautarocolombo/IARA.git