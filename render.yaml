services:
  - type: web
    name: artesaniagualeguay-backend
    env: node
    rootDirectory: backend
    plan: free
    buildCommand: npm ci --only=production --no-audit --no-fund && node scripts/migrate-neon.js
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS_HASH
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        generateValue: true
      - key: SITE_URL
        value: https://artesaniagualeguay.com
      - key: BACKEND_URL
        value: https://api.artesaniagualeguay.com
      - key: ALLOWED_ORIGINS
        value: https://artesaniagualeguay.com,https://*.vercel.app,http://localhost:3000,http://localhost:5173
      - key: SHIPPING_COST
        value: "200"
      - key: SHIPPING_THRESHOLD
        value: "2000"
      - key: EMAIL_FROM
        value: noreply@artesaniagualeguay.com
      - key: ADMIN_NOTIFICATION_EMAIL
        value: admin@artesaniagualeguay.com
      - key: RESEND_API_KEY
        value: ""
      - key: WHATSAPP
        value: "+5493444634444"
      - key: LOG_LEVEL
        value: info
    autoDeploy: true
    branch: main
    repo: https://github.com/Lautarocolombo/IARA.git
