services:
  - type: web
    name: iara-backend
    env: node
    rootDirectory: backend
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: Iara
      - key: ADMIN_PASS_HASH
        value: "$2b$10$w5YhXTWi/AKpu8cifWV7iOSOcz8w1sqxCUJFBWBlCSinL2PIUnfKa"
        # Password por defecto: "pulseras2026" (hash bcrypt). Cámbialo tras primer login
        # con el endpoint /api/admin/change-password y actualizá esta variable en el Dashboard de Render.
      - key: DATABASE_URL
        generateValue: true
      - key: SITE_URL
        value: https://iara-lovat.vercel.app
      - key: BACKEND_URL
        value: https://iara-uxcu.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://iara-lovat.vercel.app,https://*.vercel.app,https://artesaniagualeguay.com,http://localhost:3000,http://localhost:3001
      - key: SHIPPING_COST
        value: "200"
      - key: SHIPPING_THRESHOLD
        value: "2000"
      - key: WHATSAPP
        value: "+5493444634444"
      - key: LOG_LEVEL
        value: info
      # Cloudinary: PARA PRODUCCIÓN es requerido para persistencia de imágenes.
      # Sin estas variables, las imágenes se guardan localmente en el filesystem efímero de Render
      # y se pierden en cada reinicio/redeploy.
      # Configurar en Render Dashboard → Settings → Environment → Environment Variables:
      #   CLOUDINARY_CLOUD_NAME = tu-cloud-name
      #   CLOUDINARY_API_KEY = tu-api-key
      #   CLOUDINARY_API_SECRET = tu-api-secret
      #   RESEND_API_KEY = re_... (para envío de emails)
      #   EMAIL_FROM = noreply@artesaniagualeguay.com
      #   ADMIN_NOTIFICATION_EMAIL = admin@artesaniagualeguay.com
    autoDeploy: true
    branch: main
    repo: https://github.com/Lautarocolombo/IARA.git
