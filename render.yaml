services:
  - type: web
    name: iara-backend
    env: node
    rootDirectory: .
    plan: free
    buildCommand: npm install --legacy-peer-deps && cd backend && npm install --legacy-peer-deps
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: Iara
      - key: ADMIN_PASS_HASH
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        value: https://iara-wz9o.vercel.app
      - key: BACKEND_URL
         value: https://iara-uxcu.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://iara-wz9o.vercel.app,https://artesaniagualeguay.com,http://localhost:3000,http://localhost:3001
      - key: SHIPPING_COST
        value: "200"
      - key: SHIPPING_THRESHOLD
        value: "2000"
      - key: EMAIL_FROM
        value: noreply@artesaniagualeguay.com
      - key: ADMIN_NOTIFICATION_EMAIL
        value: admin@artesaniagualeguay.com
      - key: RESEND_API_KEY
        value: ""
      - key: WHATSAPP
        value: "+5493444634444"
      - key: LOG_LEVEL
        value: info
    autoDeploy: true
    branch: main
    repo: https://github.com/Lautarocolombo/IARA.git
