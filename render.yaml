services:
  - type: web
    name: iara-backend
    env: node
    rootDirectory: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: Iara
      # ADMIN_PASS_HASH and DATABASE_URL must be set manually in the Render dashboard.
      # See comments in backend/src/server.js for the generation command.
      - key: ALLOWED_ORIGINS
        value: https://iara-eight.vercel.app,https://iara-ivory.vercel.app,https://iara-alpha.vercel.app,https://artesaniagualeguay.com,http://localhost:3000
    autoDeploy: true
    branch: main
    repo: https://github.com/Lautarocolombo/IARA.git
