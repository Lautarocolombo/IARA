services:
  - type: web
    name: iara-backend
    env: node
    rootDirectory: backend
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: Iara
      - key: ADMIN_PASS_HASH
        value: $2b$10$ZPX53uqrfUH6G.AfC.nFVeD5.TAi/VN3xH7pdak4a/54uzdOonlme
      - key: ADMIN_PASS
        value: pulseras2026
      - key: DATABASE_URL
        generateValue: true
      - key: SITE_URL
        value: https://iara-ivory.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://iara-ivory.vercel.app,https://*.vercel.app,https://artesaniagualeguay.com,http://localhost:3000,http://localhost:3001
      - key: SHIPPING_COST
        value: "200"
      - key: SHIPPING_THRESHOLD
        value: "2000"
      - key: WHATSAPP
        value: "+5493444634444"
    autoDeploy: true
    branch: main
    repo: https://github.com/Lautarocolombo/IARA.git
