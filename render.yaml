services:
  - type: web
    name: iara-backend
    env: node
    rootDirectory: backend
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: lara
      - key: ADMIN_PASS
        value: pulseras2026
      # ADMIN_PASS_HASH: hash bcrypt correcto de "pulseras2026" (prioridad sobre ADMIN_PASS)
      # Generar: node -e "const bcrypt=require('bcrypt'); bcrypt.hash('pulseras2026',10).then(h=>console.log(h))"
      # Configurar en Render Dashboard → Settings → Environment → Add Environment Variable
      - key: DATABASE_URL
        generateValue: true
      - key: SITE_URL
        value: https://iara-lovat.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://iara-lovat.vercel.app,https://*.vercel.app,https://artesaniagualeguay.com,http://localhost:3000,http://localhost:3001
      - key: SHIPPING_COST
        value: "200"
      - key: SHIPPING_THRESHOLD
        value: "2000"
      - key: WHATSAPP
        value: "+5493444634444"
    autoDeploy: true
    branch: main
    repo: https://github.com/Lautarocolombo/IARA.git
