<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#d47090" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png" />

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />

<body>
  <div class="container" style="max-width:960px;margin:0 auto;padding:100px 24px 40px;">
    <nav class="breadcrumbs" style="margin-bottom:1.5rem;font-size:0.85rem;color:var(--text-muted);" aria-label="Migas de pan">

      <span style="margin:0 0.4rem;">/</span>

  <script src="../js/config.js"></script>
  <script src="../js/csrf.js"></script>

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
