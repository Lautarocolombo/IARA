name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Lint backend
        run: cd backend && npm run lint
      - name: Run frontend tests
        run: npm test
      - name: Run backend tests
        run: cd backend && node --version && npm --version && npm test 2>&1 | tee test-output.txt
        env:
          ADMIN_USER: testadmin
          JWT_SECRET: test-jwt-secret
          ADMIN_PASS_HASH: $2b$10$testhashtesthashtesthaste
          ALLOWED_ORIGINS: http://localhost:3000
          NODE_ENV: test
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: backend/test-output.txt

  deploy-vercel:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && jobs.lint-and-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build and deploy
        run: vercel build --prod && vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
