name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Lint backend
        run: cd backend && npm run lint
      - name: Run frontend unit tests
        run: npm test
      - name: Run backend tests
        run: cd backend && mkdir -p data && npm run test:ci 2>&1 | tee test-output.txt
        env:
          ADMIN_USER: testadmin
          JWT_SECRET: test-jwt-secret
          ADMIN_PASS_HASH: $2b$10$testhashtesthashtesthaste
          ALLOWED_ORIGINS: http://localhost:3000
          NODE_ENV: test
          DATABASE_URL: ''
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: backend/test-output.txt

  migrate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund
      - name: Run migrations
        run: |
          cd backend
          DATABASE_URL=postgresql://test:test@localhost:5432/test npm run migrate
        env:
          NODE_ENV: test

  e2e:
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          cd backend
          DATABASE_URL=postgresql://test:test@localhost:5432/test npm start &
          sleep 10
        env:
          ADMIN_USER: testadmin
          JWT_SECRET: test-jwt-secret
          ADMIN_PASS_HASH: $2b$10$testhashtesthashtesthaste
          ALLOWED_ORIGINS: http://localhost:3000
          NODE_ENV: test
          PORT: 3000
      - name: Run E2E tests
        run: npx playwright test --config=playwright.audit.config.js
        env:
          TEST_BASE_URL: http://localhost:3000
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/