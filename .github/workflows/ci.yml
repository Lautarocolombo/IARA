name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Lint backend
        run: cd backend && npm run lint
      - name: Run frontend unit tests
        run: npm test
      - name: Run backend tests
        run: cd backend && mkdir -p data && npm run test:ci 2>&1 | tee test-output.txt
        env:
          ADMIN_USER: testadmin
          JWT_SECRET: test-jwt-secret
          ADMIN_PASS_HASH: $2b$10$testhashtesthashtesthaste
          ALLOWED_ORIGINS: http://localhost:3000
          NODE_ENV: test
          DATABASE_URL: ''
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: backend/test-output.txt
