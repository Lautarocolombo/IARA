name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Lint backend
        run: cd backend && npm run lint
      - name: Run frontend unit tests
        run: npm test
      - name: Run backend tests
        run: cd backend && mkdir -p data && npm test 2>&1 | tee test-output.txt
        env:
          ADMIN_USER: testadmin
          JWT_SECRET: test-jwt-secret
          ADMIN_PASS_HASH: $2b$10$testhashtesthashtesthaste
          ALLOWED_ORIGINS: http://localhost:3000
          NODE_ENV: test
          DATABASE_URL: ''
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: backend/test-output.txt

  e2e-tests:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run backend (detached)
        run: |
          cd backend
          export ADMIN_USER='testadmin'
          export JWT_SECRET='test-jwt-secret'
          export ADMIN_PASS_HASH='$2b$10$testhashtesthashtesthaste'
          export ALLOWED_ORIGINS='http://localhost:3000'
          export NODE_ENV='test'
          export DATABASE_URL=''
          node src/server.js > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for backend
        run: |
          max=30
          for i in $(seq 1 $max); do
            if curl -sSf http://localhost:3000/health > /dev/null; then
              break
            fi
            sleep 1
          done
      - name: Run Playwright E2E
        run: npx playwright test --config=playwright.audit.config.js --project=chromium
        env:
          CI: true
      - name: Stop backend
        if: always()
        run: |
          if [ -f backend/server.pid ]; then
            pid=$(cat backend/server.pid)
            kill $pid || true
          fi
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
