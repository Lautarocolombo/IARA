name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Lint backend
        run: cd backend && npm run lint
      - name: Run frontend unit tests
        run: npm test
      - name: Run backend tests
        run: cd backend && mkdir -p data && npm test 2>&1 | tee test-output.txt
        env:
          ADMIN_USER: testadmin
          JWT_SECRET: test-jwt-secret
          ADMIN_PASS_HASH: $2b$10$testhashtesthashtesthaste
          ALLOWED_ORIGINS: http://localhost:3000
          NODE_ENV: test
          DATABASE_URL: ''
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: backend/test-output.txt

  e2e-tests:
    needs: lint-and-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run backend (detached)
        run: |
          cd backend
          $env:ADMIN_USER='testadmin'; $env:JWT_SECRET='test-jwt-secret'; $env:ADMIN_PASS_HASH='$2b$10$testhashtesthashtesthaste'; $env:ALLOWED_ORIGINS='http://localhost:3000'; $env:NODE_ENV='test'; $env:DATABASE_URL=''; node src/server.js &
          echo $! > server.pid
        shell: powershell
      - name: Wait for backend
        run: |
          $max = 30; $i = 0
          while ($i -lt $max) {
            try {
              $r = Invoke-WebRequest -Uri 'http://localhost:3000/health' -UseBasicParsing
              if ($r.StatusCode -eq 200) { break }
            } catch {}
            Start-Sleep -Seconds 1
            $i++
          }
        shell: powershell
      - name: Run Playwright E2E
        run: npx playwright test --config=playwright.audit.config.js --project=chromium
        env:
          CI: true
      - name: Stop backend
        if: always()
        run: |
          if (Test-Path "backend/server.pid") {
            $pid = Get-Content backend/server.pid
            Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue
          }
        shell: powershell
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
