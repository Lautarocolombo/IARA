name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [5432:5432]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Lint backend
        run: cd backend && npm run lint
      - name: Run frontend unit tests
        run: npm test
      - name: Run backend unit tests with coverage
        run: cd backend && mkdir -p coverage && npm run test:ci
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          ADMIN_USER: testadmin
          ADMIN_PASS_HASH: $2b$10$testhashtesthashtesthas
          DATABASE_URL: ''
        timeout-minutes: 10
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: npx playwright test --config=playwright.audit.config.js
        env:
          CI: true
        continue-on-error: true

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high || true
          cd backend && npm audit --audit-level=high || true
        continue-on-error: true
      - name: Check for exposed secrets
        run: |
          if grep -rEn \
            --include="*.env*" --include="*.js" --include="*.json" --include="*.html" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=coverage \
            --exclude-dir=test-results --exclude-dir=.playwright \
            --exclude="render.yaml" --exclude=".env.example" --exclude="AGENTS.md" \
            --exclude="package-lock.json" --exclude="yarn.lock" --exclude="pnpm-lock.yaml" \
            --exclude="backend/test-upload-vercel.js" --exclude="backend/test_admin_products.js" \
            --exclude="backend/fix_neon_user.js" --exclude="backend/check_*.js" --exclude="backend/verify_*.js" \
            -e "AKIA[0-9A-Z]{16}" -e "AIza[0-9A-Za-z\\-_]{35}" -e "sk_live_[0-9a-zA-Z]{24,}" -e "pk_live_[0-9a-zA-Z]{24,}" -e "sk_test_[0-9a-zA-Z]{24,}" -e "pk_test_[0-9a-zA-Z]{24,}" -e "VERCEL_OIDC_TOKEN" -e "xox[baprs]-[0-9a-zA-Z-]+" -e "-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY-----" -e "mongodb(\+srv)?://[^ ]+" -e "postgres(ql)?://[^ ]+" -e "mysql://[^ ]+" -e "jdbc:[a-zA-Z0-9]+://[^ ]+" \
            .; then
            echo "ERROR: Secrets detectados en código"
            exit 1
          fi
          echo "No se detectaron secrets expuestos"

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build and deploy
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --force
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Smoke test
        run: |
          $siteUrl = if ($env:FRONTEND_URL) { $env:FRONTEND_URL } else { 'https://artesaniagualeguay.com' }
          $max = 30; $i = 0
          while ($i -lt $max) {
            try {
              $r = Invoke-WebRequest -Uri "$siteUrl/health" -UseBasicParsing
              if ($r.StatusCode -eq 200) { Write-Host "Health check OK"; break }
            } catch {}
            Start-Sleep -Seconds 2
            $i++
          }
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://artesaniagualeguay.com' }}
