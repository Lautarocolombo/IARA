name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [5432:5432]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Lint backend
        run: cd backend && npm run lint
      - name: Run unit tests
        run: npm test
      - name: Run backend unit tests with coverage
        run: cd backend && npm run test:ci
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          ADMIN_USER: testadmin
          ADMIN_PASS_HASH: $2b$10$testhashtesthashtesthas
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: npx playwright test --config=playwright.audit.config.js
        env:
          CI: true
        continue-on-error: false

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          cd backend && npm audit --audit-level=high
      - name: Check for exposed secrets
        run: |
          if grep -rE "VERCEL_OIDC_TOKEN|sk_live_|pk_live_|sk_test_|pk_test_|api_key|secret_key|password|pass_hash" --include="*.env*" --include="*.js" --include="*.json" --include="*.html" .; then
            echo "ERROR: Secrets detectados en código"
            exit 1
          fi
          echo "No se detectaron secrets expuestos"

  deploy:
    needs: [test, security-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build and deploy
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --force
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Smoke test
        run: |
          $siteUrl = if ($env:FRONTEND_URL) { $env:FRONTEND_URL } else { 'https://artesaniagualeguay.com' }
          $max = 30; $i = 0
          while ($i -lt $max) {
            try {
              $r = Invoke-WebRequest -Uri "$siteUrl/health" -UseBasicParsing
              if ($r.StatusCode -eq 200) { Write-Host "Health check OK"; break }
            } catch {}
            Start-Sleep -Seconds 2
            $i++
          }
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://artesaniagualeguay.com' }}
