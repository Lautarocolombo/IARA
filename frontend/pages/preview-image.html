<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview Producto - Imagen en Sitio</title>
  <link rel="canonical" href="https://iara-ivory.vercel.app/pages/preview-image.html" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <style>
    .preview-wrap {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .preview-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      margin-bottom: 1rem;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
    }
    .product-card {
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(212, 112, 144, 0.10);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .product-image {
      width: 100%;
      aspect-ratio: 1/1;
      background: linear-gradient(135deg, #fde8ef, #f8d5e4);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }
    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 12px;
      display: block;
    }
    .product-info {
      padding: 1rem;
    }
    .product-name {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.25rem;
    }
    .product-price {
      color: var(--blush);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="preview-wrap">
    <h1 class="preview-title">Preview: cómo se vería la imagen en el sitio</h1>
    <div class="products-grid">
      <div class="product-card">
        <div class="product-image">
          <img src="../assets/pulsera-con-tigo-tengo.jpg" alt="Pulsera Con tigo tengo" />
        </div>
        <div class="product-info">
          <div class="product-name">Pulsera Con tigo tengo</div>
          <div class="product-price">$ 450</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
