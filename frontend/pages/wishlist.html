<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favoritos | Artesanía Gualeguay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
</head>
<body>
  <!-- ============== NAVBAR =============== -->
  <nav class="navbar" id="navbar">
    <div class="navbar-container">
      <div class="navbar-brand">
        <a href="../index.html" class="logo">
          <span class="logo-dot" aria-hidden="true"></span>
          <span class="logo-text">Artesanía Gualeguay</span>
        </a>
      </div>

      <a href="../index.html" class="nav-back" aria-label="Volver al inicio">← Volver al inicio</a>

      <div class="navbar-actions">
        <button id="themeToggle" class="theme-toggle" title="Cambiar tema" aria-label="Alternar modo claro/oscuro" aria-pressed="false">
          <span class="theme-icon theme-icon-sun" aria-hidden="true">☀️</span>
          <span class="theme-icon theme-icon-moon" aria-hidden="true">🌙</span>
        </button>
        <a href="wishlist.html" class="wishlist-link" aria-label="Favoritos">
          <span class="wishlist-icon" aria-hidden="true">❤️</span>
          <span class="wishlist-count" id="wishlistCount">0</span>
        </a>
        <a href="admin.html" class="admin-link" aria-label="Panel de Administración" title="Panel de Admin">
          <span class="admin-icon" aria-hidden="true">🐰</span>
        </a>
        <a href="../pages/cart.html" class="cart-link" aria-label="Carrito">
          <span class="cart-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          </span>
          <span class="cart-count" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </nav>

  <main style="padding-top: 100px;">
    <section class="catalog" style="padding: 3rem 40px;">
      <div class="section-header">
        <span class="section-tag reveal">Favoritos</span>
        <h1 class="section-title reveal">Tu lista de deseos</h1>
        <p class="section-subtitle reveal">Productos que te gustaron</p>
      </div>

      <div id="emptyWishlist" class="empty-cart-container reveal" style="display:none;">
        <h2>No tenés favoritos aún</h2>
        <p>Explorá el catálogo y guardá tus productos preferidos.</p>
        <a href="../index.html#catalog" class="btn-primary">Explorar Productos</a>
      </div>

      <div id="wishlistContent">
        <div class="catalog-grid" id="wishlistGrid"></div>
      </div>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/wishlist.js"></script>
  <script>
    function renderWishlist() {
      const items = getWishlist();
      const grid = document.getElementById('wishlistGrid');
      const empty = document.getElementById('emptyWishlist');
      const content = document.getElementById('wishlistContent');

      if (items.length === 0) {
        empty.style.display = 'block';
        content.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      content.style.display = 'block';

      grid.innerHTML = items.map(product => `
        <div class="product-card reveal" data-product-id="${product.id}">
          <div class="product-image" aria-hidden="true">${product.image ? `<img src="${product.image}" alt="${product.name}" loading="lazy" />` : (product.emoji || '📿')}</div>
          <div class="product-info">
            <span class="product-category">${product.category || ''}</span>
            <h3 class="product-name">${product.name}</h3>
            <p class="product-description">Producto artesanal único</p>
            <div class="product-footer">
              <span class="product-price">${formatARS(product.price)}</span>
              <div style="display:flex;gap:0.5rem;">
                <button class="btn-add-cart" onclick="addToCart(${JSON.stringify({id: product.id, name: product.name, price: product.price, emoji: product.emoji||'📿', image: product.image||'', stock: product.stock||0, unit: 'u', qty: 1})}); renderWishlist();" aria-label="Agregar ${product.name} al carrito"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
                <button class="btn-outline btn-sm" onclick="removeFromWishlist(${product.id}); renderWishlist();">Quitar</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderWishlist);
  </script>
</body>
</html>
