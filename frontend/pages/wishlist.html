<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favoritos | Artesanía Gualeguay</title>
  <meta name="description" content="Tu lista de deseos en Artesanía Gualeguay. Productos favoritos y pendientes de compra." />
  <link rel="canonical" href="https://artesaniagualeguay.com/pages/wishlist.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pill-buttons.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/pages.css" />
</head>
<body>
  <a href="#content" class="skip-link">Saltar al contenido principal</a>

  <script src="../js/config.js"></script>
  <script src="../js/safeImage.js"></script>
  <script src="../js/header.js"></script>
  <script>
    initSiteHeader({ showBackButton: true });
  </script>
  <script src="../js/theme.js"></script>
  <main style="padding-top: 100px;">
    <section class="catalog catalog-page-section">
      <nav aria-label="Breadcrumb" class="breadcrumb">
        <a href="../index.html">Inicio</a> <span aria-hidden="true">/</span> <span>Favoritos</span>
      </nav>
      <div class="section-header">
        <span class="section-tag reveal">Favoritos</span>
        <h1 class="section-title reveal">Tu lista de deseos</h1>
        <p class="section-subtitle reveal">Productos que te gustaron</p>
      </div>

      <div id="emptyWishlist" class="empty-cart-container reveal" style="display:none;">
        <h2>No tenés favoritos aún</h2>
        <p>Explorá el catálogo y guardá tus productos preferidos.</p>
        <a href="../index.html#catalog" class="btn-primary">Explorar Productos</a>
      </div>

      <div id="wishlistContent">
        <div class="catalog-grid" id="wishlistGrid"></div>
      </div>
    </section>
  </main>

  <script src="../js/ui.js"></script>
  <script src="../js/wishlist.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    function renderWishlist() {
      const items = getWishlist();
      const grid = document.getElementById('wishlistGrid');
      const empty = document.getElementById('emptyWishlist');
      const content = document.getElementById('wishlistContent');

      if (items.length === 0) {
        empty.style.display = 'block';
        content.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      content.style.display = 'block';

      grid.innerHTML = items.map(product => `
        <div class="product-card reveal" data-product-id="${product.id}">
          <div class="product-image" aria-hidden="true">${product.image ? `${window.renderProductImage(product.image, product.name, { placeholder: '📿' })}` : (product.emoji || '📿')}</div>
          <div class="product-info">
            <span class="product-category">${product.category || ''}</span>
            <h3 class="product-name">${product.name}</h3>
            <p class="product-description">Producto artesanal único</p>
            <div class="product-footer">
              <span class="product-price">${formatARS(product.price)}</span>
              <div style="display:flex;gap:0.5rem;">
                <button class="btn-add-cart" data-product-id="${product.id}" data-product-name="${product.name.replace(/"/g, '&quot;')}" data-product-price="${product.price}" data-product-emoji="${product.emoji||'📿'}" data-product-image="${(product.image||'').replace(/"/g, '&quot;')}" data-product-stock="${product.stock||0}" aria-label="Agregar ${product.name} al carrito"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
                <button class="btn-outline btn-sm" onclick="removeFromWishlist(${product.id}); renderWishlist();">Quitar</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderWishlist);

    window.addEventListener('storage', (e) => {
      if (e.key === 'ag_wishlist') {
        renderWishlist();
      }
    });

    onSyncMessage('wishlist_updated', renderWishlist);
    onSyncMessage('products_updated', () => {
      if (typeof fetchProducts === 'function') {
        fetchProducts().then(() => renderWishlist());
      }
    });
    onSyncMessage('hero_updated', () => {
      if (typeof loadHeroCards === 'function') loadHeroCards();
    });
  </script>
</body>
</html>
