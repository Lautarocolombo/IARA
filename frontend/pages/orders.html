<body>

  <main id="content" class="orders-wrap">
    <nav aria-label="Breadcrumb" class="breadcrumb">
      <a href="../index.html">Inicio</a> <span aria-hidden="true">/</span> <span>Mis Pedidos</span>
    </nav>
    <a href="../index.html" class="back-link">← Volver al sitio</a>
    <h1>Mis Pedidos</h1>
    <div id="ordersLookup">
      <p style="color:var(--text-muted);margin-bottom:1.5rem;">Ingresá tu email para ver el historial de tu compra:</p>
      <form id="orderLookupForm" style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:end;">
        <div style="flex:1;min-width:220px;">
          <input type="email" id="orderEmail" placeholder="tu@email.com" required style="width:100%;padding:0.6rem;border:1px solid var(--rose-light);border-radius:var(--radius-sm);font-size:0.9rem;background:var(--white);" />
        </div>
        <button type="submit" class="btn-primary btn-sm">Buscar pedidos</button>
      </form>
    </div>
    <div id="ordersContainer" style="display:none;"></div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/safeImage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/wishlist.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    async function loadOrders(email) {
      const container = document.getElementById('ordersContainer');
      const lookup = document.getElementById('ordersLookup');
      if (!container) return;
      try {
        const res = await window.fetchWithRetry(`${CONFIG.API.BASE}/api/orders?email=${encodeURIComponent(email)}`, {}, 2, 1000);
        if (!res) throw new Error('Error al cargar pedidos');
        const orders = await res.json();
        if (!orders.length) {
          container.innerHTML = '<div class="empty-orders"><h2>No tenés pedidos</h2><p>No encontramos pedidos asociados a ese email.</p><a href="../index.html#catalog" class="btn-primary" style="margin-top:1rem;">Ver catálogo</a></div>';
          container.style.display = 'block';
          if (lookup) lookup.style.display = 'none';
          return;
        }
        container.innerHTML = orders.map(order => {
          const statusClass = 'status-' + (order.status || 'pending');
          const items = (() => { try { return JSON.parse(order.items || '[]'); } catch (e) { return []; } })();
          return `
            <div class="order-card">
              <div class="order-header">
                <div>
                  <span class="order-id">Pedido #${order.id}</span>
                  <span class="order-date">${new Date(order.created_at).toLocaleDateString('es-AR')}</span>
                </div>
                <span class="order-status ${statusClass}">${order.status || 'pending'}</span>
              </div>
              <div class="order-items">
                ${items.map(item => `
                  <div class="order-item">
                    <span>${item.name} x${item.qty || item.quantity || 1}</span>
                    <span>${formatARS((item.price || 0) * (item.quantity || item.qty || 1))}</span>
                  </div>
                `).join('')}
              </div>
              <div class="order-total">Total: ${formatARS(order.total)}</div>
            </div>
          `;
        }).join('');
        container.style.display = 'block';
        if (lookup) lookup.style.display = 'none';
      } catch (err) {
        showToast('', window.getFetchErrorMessage(err) || 'Error al cargar pedidos. Intentá nuevamente más tarde.', 'error');
        container.innerHTML = '<div class="empty-orders"><h2>Error al cargar pedidos</h2><p>Intentá nuevamente más tarde.</p></div>';
        container.style.display = 'block';
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('orderLookupForm');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('orderEmail').value.trim();
          if (!email) return;
          loadOrders(email);
        });
      }
    });
  </script>
</body>
</html>
