<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Pedidos | Artesanía Gualeguay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <style>
    .orders-wrap{max-width:900px;margin:0 auto;padding:100px 24px 40px;}
    .order-card{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);border:1px solid #f4d0da;padding:1.5rem;margin-bottom:1rem;}
    .order-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1rem;}
    .order-id{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--text-dark);}
    .order-date{color:var(--text-muted);font-size:0.85rem;}
    .order-status{display:inline-block;padding:0.25rem 0.75rem;border-radius:999px;font-size:0.8rem;font-weight:600;text-transform:uppercase;}
    .status-pending{background:#fef3c7;color:#92400e;}
    .status-approved{background:#d1fae5;color:#065f46;}
    .status-rejected{background:#fee2e2;color:#991b1b;}
    .status-shipped{background:#dbeafe;color:#1e40af;}
    .order-items{margin:1rem 0;}
    .order-item{display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid #f4c8d4;}
    .order-total{font-weight:700;text-align:right;padding-top:0.5rem;}
    .empty-orders{text-align:center;padding:3rem 1rem;color:var(--text-muted);}
    .back-link{display:inline-flex;align-items:center;gap:0.4rem;color:var(--text-mid);font-size:0.9rem;font-weight:500;margin-bottom:2rem;}
    .loading-skeleton{background:linear-gradient(90deg,#f4d0da 25%,#fdf6f8 50%,#f4d0da 75%);background-size:200% 100%;animation:ag-shimmer 1.5s infinite;border-radius:var(--radius-sm);height:1rem;width:100%;}
    @keyframes ag-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
</head>
<body>
  <a href="#content" class="skip-link">Saltar al contenido</a>
  <nav class="navbar" id="navbar">
    <div class="navbar-container">
      <div class="navbar-brand">
        <a href="../index.html" class="logo">
          <span class="logo-dot" aria-hidden="true"></span>
          <span class="logo-text">Artesanía Gualeguay</span>
        </a>
      </div>
    </div>
  </nav>
  <main id="content" class="orders-wrap">
    <a href="../index.html" class="back-link">← Volver al sitio</a>
    <h1>Mis Pedidos</h1>
    <div id="ordersContainer">
      <div class="loading-skeleton" style="height:200px;"></div>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    async function loadOrders() {
      const container = document.getElementById('ordersContainer');
      if (!container) return;
      try {
        const res = await fetch(`${CONFIG.API.BASE}/api/orders`);
        if (!res.ok) throw new Error('Error al cargar pedidos');
        const orders = await res.json();
        if (!orders.length) {
          container.innerHTML = '<div class="empty-orders"><h2>No tenés pedidos</h2><p>Explorá el catálogo y realizá tu primera compra.</p><a href="../index.html#catalog" class="btn-primary" style="margin-top:1rem;">Ver catálogo</a></div>';
          return;
        }
        container.innerHTML = orders.map(order => {
          const statusClass = 'status-' + (order.status || 'pending');
          const items = JSON.parse(order.items || '[]');
          return `
            <div class="order-card">
              <div class="order-header">
                <div>
                  <span class="order-id">Pedido #${order.id}</span>
                  <span class="order-date">${new Date(order.created_at).toLocaleDateString('es-AR')}</span>
                </div>
                <span class="order-status ${statusClass}">${order.status || 'pending'}</span>
              </div>
              <div class="order-items">
                ${items.map(item => `
                  <div class="order-item">
                    <span>${item.name} x${item.qty || 1}</span>
                    <span>${formatARS(item.price * (item.qty || 1))}</span>
                  </div>
                `).join('')}
              </div>
              <div class="order-total">Total: ${formatARS(order.total)}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<div class="empty-orders"><h2>Error al cargar pedidos</h2><p>Intentá nuevamente más tarde.</p></div>';
      }
    }
    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
