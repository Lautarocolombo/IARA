<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Pedidos | Artesanía Gualeguay</title>
  <meta name="description" content="Consultá el historial de tus pedidos en Artesanía Gualeguay. Ingresá tu email para ver el estado de tus compras." />
  <link rel="canonical" href="https://artesaniagualeguay.com/pages/orders.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pill-buttons.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/orders.css" />
</head>
<body>
  <a href="#content" class="skip-link">Saltar al contenido</a>

  <script src="../js/config.js"></script>
  <script src="../js/safeImage.js"></script>
  <script src="../js/header.js"></script>
  <script>
    initSiteHeader({ showBackButton: true });
  </script>
  <script src="../js/theme.js"></script>
  <main id="content" class="orders-wrap">
    <div class="orders-container">
      <nav aria-label="Breadcrumb" class="breadcrumb">
        <a href="../index.html">Inicio</a> <span aria-hidden="true">/</span> <span>Mis Pedidos</span>
      </nav>
      <a href="../index.html" class="back-link">← Volver al sitio</a>
      <div class="section-header">
        <span class="section-tag">Historial</span>
        <h1 class="section-title">Mis Pedidos</h1>
        <p class="section-subtitle">Consultá el estado de tus compras ingresando el email usado en el pedido.</p>
      </div>
      <div id="ordersLookup">
        <form id="orderLookupForm" class="orders-form">
          <input type="email" id="orderEmail" placeholder="tu@email.com" required />
          <button type="submit" class="btn-primary">Buscar pedidos</button>
        </form>
      </div>
      <div id="ordersContainer" style="display:none;"></div>
    </div>
  </main>
  <script src="../js/ui.js"></script>
  <script src="../js/wishlist.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    async function loadOrders(email) {
      const container = document.getElementById('ordersContainer');
      const lookup = document.getElementById('ordersLookup');
      if (!container) return;
      try {
        const res = await window.fetchWithRetry(`${CONFIG.API.BASE}/api/orders?email=${encodeURIComponent(email)}`, {}, 2, 1000);
        if (!res) throw new Error('Error al cargar pedidos');
        const orders = await res.json();
        currentOrderEmail = email;
        if (!orders.length) {
          container.innerHTML = '<div class="empty-orders"><h2>No tenés pedidos</h2><p>No encontramos pedidos asociados a ese email.</p><a href="../index.html#catalog" class="btn-primary" style="margin-top:1rem;">Ver catálogo</a></div>';
          container.style.display = 'block';
          if (lookup) lookup.style.display = 'none';
          startOrderPolling(email);
          return;
        }
        container.innerHTML = orders.map(order => {
          const statusClass = 'status-' + (order.status || 'pending');
          const items = (() => { try { return JSON.parse(order.items || '[]'); } catch (e) { return []; } })();
          return `
            <div class="order-card">
              <div class="order-header">
                <div>
                  <span class="order-id">Pedido #${order.id}</span>
                  <span class="order-date">${new Date(order.created_at).toLocaleDateString('es-AR')}</span>
                </div>
                <span class="order-status ${statusClass}">${order.status || 'pending'}</span>
              </div>
              <div class="order-items">
                ${items.map(item => `
                  <div class="order-item">
                    <span>${item.name} x${item.qty || item.quantity || 1}</span>
                    <span>${formatARS((item.price || 0) * (item.quantity || item.qty || 1))}</span>
                  </div>
                `).join('')}
              </div>
              <div class="order-total">Total: ${formatARS(order.total)}</div>
            </div>
          `;
        }).join('');
        container.style.display = 'block';
        if (lookup) lookup.style.display = 'none';
        startOrderPolling(email);
      } catch (err) {
        showToast('', window.getFetchErrorMessage(err) || 'Error al cargar pedidos. Intentá nuevamente más tarde.', 'error');
        container.innerHTML = '<div class="empty-orders"><h2>Error al cargar pedidos</h2><p>Intentá nuevamente más tarde.</p></div>';
        container.style.display = 'block';
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('orderLookupForm');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('orderEmail').value.trim();
          if (!email) return;
          loadOrders(email);
        });
      }
    });

    let currentOrderEmail = '';
    function startOrderPolling(email) {
      currentOrderEmail = email;
      stopDataSync('user-orders');
      startDataSync('user-orders', () => {
        if (currentOrderEmail && document.getElementById('ordersContainer')) {
          loadOrders(currentOrderEmail);
        }
      });
    }

    onSyncMessage('order_created', () => {
      if (currentOrderEmail && document.getElementById('ordersContainer')) {
        loadOrders(currentOrderEmail);
      }
    });

    onSyncMessage('order_status_updated', () => {
      if (currentOrderEmail && document.getElementById('ordersContainer')) {
        loadOrders(currentOrderEmail);
      }
    });

    onSyncMessage('hero_updated', () => {
      if (typeof loadHeroCards === 'function') loadHeroCards();
    });

    onSyncMessage('products_updated', () => {
      if (typeof fetchProducts === 'function') {
        fetchProducts().then(() => {
          if (typeof renderProducts === 'function') renderProducts(getProducts());
        });
      }
    });
  </script>
</body>
</html>
