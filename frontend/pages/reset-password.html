<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña - Artesanía Gualeguay</title>
  <link rel="canonical" href="https://iara-ivory.vercel.app/pages/reset-password.html" />
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="../index.html" class="logo">
        <span class="logo-icon">📿</span>
        <span class="logo-text">Artesanía Gualeguay</span>
      </a>
    </nav>
  </header>

  <main class="main">
    <div class="container">
      <div class="auth-card">
        <h1 class="auth-title">Restablecer contraseña</h1>
        <p class="auth-subtitle">Ingresá tu nueva contraseña.</p>

        <form id="resetForm" class="auth-form">
          <div class="form-group">
            <label for="newPassword">Nueva contraseña</label>
            <input type="password" id="newPassword" name="newPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
            <span class="error" id="error-newPassword"></span>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repetí tu contraseña" required minlength="6" autocomplete="new-password">
            <span class="error" id="error-confirmPassword"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Restablecer contraseña</button>
        </form>

        <p class="auth-footer">
          <a href="../index.html">Volver al inicio</a>
        </p>
      </div>
    </div>
  </main>

  <script>
    (function() {
      'use strict';

      const API_BASE = window.CONFIG?.API?.BASE || '';
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const resetForm = document.getElementById('resetForm');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const submitBtn = document.getElementById('submitBtn');

      function showError(fieldId, message) {
        const el = document.getElementById('error-' + fieldId);
        if (el) el.textContent = message || '';
      }

      if (!token) {
        window.location.href = '../pages/forgot-password.html';
      }

      resetForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        showError('newPassword', '');
        showError('confirmPassword', '');

        let hasError = false;
        if (!newPasswordInput.value || newPasswordInput.value.length < 6) {
          showError('newPassword', 'La contraseña debe tener al menos 6 caracteres');
          hasError = true;
        }
        if (newPasswordInput.value !== confirmPasswordInput.value) {
          showError('confirmPassword', 'Las contraseñas no coinciden');
          hasError = true;
        }
        if (hasError) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Restableciendo...';

        try {
          const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword: newPasswordInput.value })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Error al restablecer contraseña');

          window.location.href = '../index.html?reset=success';
        } catch (err) {
          showError('newPassword', 'Error al restablecer contraseña. Intentá nuevamente.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Restablecer contraseña';
        }
      });
    })();
  </script>
</body>
</html>
