<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin | Artesanía Gualeguay</title>
  <meta name="description" content="Panel de administración de Artesanía Gualeguay. Accedé para gestionar el sitio." />
  <link rel="canonical" href="https://artesaniagualeguay.com/pages/admin.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <script src="../js/config.js"></script>
  <script src="../js/safeImage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/connection.js?v=2026080614"></script>
  <script src="../js/admin.js?v=2026081004"></script>
</head>
<body>
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <h2>🌸 Artesanía Admin</h2>
      <p id="loginMessage">Iniciá sesión para continuar</p>
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="loginUser" placeholder="Usuario" autocomplete="username" />
      </div>
      <div class="form-group password-group">
        <label>Contraseña</label>
        <div class="password-input-wrapper">
          <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password" />
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Mostrar contraseña">
            <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary btn-full" id="loginBtn">Ingresar</button>
      <p class="login-hint" id="loginHint">Verificando...</p>
      <button class="btn btn-secondary btn-sm hidden" id="retryHealthBtn" class="retry-health-btn">Reintentar conexión</button>
      <p id="loginError" class="login-error login-error-muted"></p>
      <a href="../index.html" class="btn btn-secondary btn-full login-back-link">← Volver al sitio</a>
    </div>
  </div>

  <div class="connection-indicator" id="connectionIndicator" title="Estado de conexión">
    <span class="dot"></span>
    <span class="connection-text">Verificando...</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</body>
</html>
