<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Producto — Artesanía Gualeguay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <style>
    .product-detail{max-width:900px;margin:0 auto;padding:100px 24px 40px;}
    .product-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;align-items:start;}
    .product-image-large{width:100%;aspect-ratio:1;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--blush),var(--mint));display:flex;align-items:center;justify-content:center;font-size:6rem;border:1px solid #f4c8d4;overflow:hidden;}
    .product-image-large img{width:100%;height:100%;object-fit:cover;}
    .product-category{display:inline-block;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.5rem;}
    .product-detail-title{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--text-dark);margin-bottom:0.75rem;line-height:1.2;}
    .product-detail-price{font-family:'Playfair Display',serif;font-weight:700;font-size:1.5rem;color:var(--rose-dark);margin-bottom:1.5rem;}
    .product-detail-desc{color:var(--text-mid);line-height:1.8;margin-bottom:1.5rem;}
    .product-detail-actions{display:flex;gap:0.75rem;flex-wrap:wrap;}
    .reviews-section{margin-top:3rem;}
    .review-card{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);border:1px solid #f4d0da;padding:1.25rem;margin-bottom:1rem;}
    .review-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;}
    .review-name{font-weight:600;color:var(--text-dark);}
    .review-rating{color:var(--gold);}
    .review-comment{color:var(--text-mid);line-height:1.7;}
    .review-form{margin-top:2rem;}
    .review-form textarea{width:100%;padding:0.75rem;border:1px solid var(--rose-light);border-radius:var(--radius-sm);font-family:inherit;font-size:0.9rem;resize:vertical;min-height:80px;}
    .rating-input{display:flex;gap:0.25rem;}
    .rating-input button{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--rose-light);transition:color 0.2s;}
    .rating-input button.active{color:var(--gold);}
    .back-link{display:inline-flex;align-items:center;gap:0.4rem;color:var(--text-mid);font-size:0.9rem;font-weight:500;margin-bottom:2rem;}
    .loading-skeleton{background:linear-gradient(90deg,#f4d0da 25%,#fdf6f8 50%,#f4d0da 75%);background-size:200% 100%;animation:ag-shimmer 1.5s infinite;border-radius:var(--radius-sm);}
    @keyframes ag-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .product-image-gallery{display:flex;gap:0.75rem;align-items:flex-start;}
    .product-image-main{width:100%;aspect-ratio:1;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--blush),var(--mint));border:1px solid #f4c8d4;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
    .product-image-main img{width:100%;height:100%;object-fit:contain;}
    .product-image-thumbs{display:flex;flex-direction:column;gap:0.5rem;overflow-y:auto;max-height:280px;flex-shrink:0;}
    .product-image-thumbs img{width:64px;height:64px;object-fit:cover;border-radius:var(--radius-sm);border:1.5px solid transparent;cursor:pointer;transition:border-color .2s,box-shadow .2s;}
    .product-image-thumbs img:hover,.product-image-thumbs img.active{border-color:var(--rose-dark);box-shadow:0 0 0 2px var(--blush);}
    @media(max-width:768px){.product-detail-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <a href="#content" class="skip-link">Saltar al contenido</a>
  <!-- ============== NAVBAR =============== -->
  <nav class="navbar" id="navbar">
    <div class="navbar-container">
      <div class="navbar-brand">
        <a href="../index.html" class="logo">
          <span class="logo-dot" aria-hidden="true"></span>
          <span class="logo-text">Artesanía Gualeguay</span>
        </a>
      </div>

      <a href="../index.html" class="nav-back" aria-label="Volver al inicio">← Volver al inicio</a>

      <div class="navbar-actions">
        <button id="themeToggle" class="theme-toggle" title="Cambiar tema" aria-label="Alternar modo claro/oscuro" aria-pressed="false">
          <span class="theme-icon theme-icon-sun" aria-hidden="true">☀️</span>
          <span class="theme-icon theme-icon-moon" aria-hidden="true">🌙</span>
        </button>
        <a href="wishlist.html" class="wishlist-link" aria-label="Favoritos">
          <span class="wishlist-icon" aria-hidden="true">❤️</span>
          <span class="wishlist-count" id="wishlistCount">0</span>
        </a>
        <a href="admin.html" class="admin-link" aria-label="Panel de Administración" title="Panel de Admin">
          <span class="admin-icon" aria-hidden="true">🐰</span>
        </a>
        <a href="../pages/cart.html" class="cart-link" aria-label="Carrito">
          <span class="cart-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          </span>
          <span class="cart-count" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </nav>
  <main id="content" class="product-detail">
    <a href="../index.html#catalog" class="back-link">← Volver al catálogo</a>
    <div id="productContent">
      <div class="loading-skeleton" style="height:400px;"></div>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/safeImage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    async function loadProduct() {
      const container = document.getElementById('productContent');
      if (!container) return;
      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');
      if (!productId) {
        container.innerHTML = '<p>Producto no encontrado.</p>';
        return;
      }
      try {
        const [productRes, reviewsRes] = await Promise.all([
          window.fetchWithRetry(`${CONFIG.API.BASE}/api/products`, {}, 2, 1000),
          window.fetchWithRetry(`${CONFIG.API.BASE}/api/products/${productId}/reviews`, {}, 2, 1000)
        ]);
        const productData = productRes ? await productRes.json() : [];
        const reviewsData = reviewsRes ? await reviewsRes.json() : [];
        const products = Array.isArray(productData) ? productData : [];
        const product = products.find(p => p.id === Number(productId));
        if (!product) {
          container.innerHTML = '<p>Producto no encontrado.</p>';
          return;
        }
const images = Array.isArray(product.images) && product.images.length
	             ? product.images
	             : (product.image ? [{ url: product.image, es_principal: true }] : [{ url: '../assets/placeholder-product.svg', es_principal: true }]);
          const principalImage = images.find(i => i.es_principal) || images[0];
          const thumbsHtml = images.map((img, i) =>
            `${window.renderProductImage(img.url, product.name + ' - imagen ' + (i + 1), { placeholder: '📿' })}`
          ).join('');
          const imageHtml = images.length
            ? `<div class="product-image-gallery"><div class="product-image-main">${window.renderProductImage(principalImage ? principalImage.url : '', product.name, { id: 'productMainImage', lazy: false, placeholder: '📿' })}</div><div class="product-image-thumbs" id="productThumbs">${thumbsHtml}</div></div>`
            : `${window.renderProductImage('', product.name, { style: 'width:100%;height:100%;object-fit:cover;', placeholder: '📿' })}`;
        container.innerHTML = `
          <div class="product-detail-grid">
            <div class="product-image-large" aria-hidden="true">${imageHtml}</div>
            <div>
              <span class="product-category">${product.category || ''}</span>
              <h1 class="product-detail-title">${product.name}</h1>
              <p class="product-detail-desc">${product.description || ''}</p>
              <p class="product-detail-price">${formatARS(product.price)}</p>
              <div class="product-detail-actions">
                <button class="btn-primary" onclick="addToCart(${JSON.stringify({id: product.id, name: product.name, price: product.price, emoji: product.emoji||'📿', image: product.image||'', stock: product.stock||0, unit: 'u', qty: 1})}); event.stopPropagation();">Agregar al carrito</button>
                <a href="https://wa.me/${CONFIG.CONTACT.WHATSAPP.replace(/[^\\d]/g,'')}?text=Hola! Me interesa el producto: ${product.name}" target="_blank" class="btn-outline" rel="noopener">Consultar por WhatsApp</a>
              </div>
            </div>
          </div>
          <div class="reviews-section">
            <h2>Reseñas</h2>
            <div id="reviewsList">
              ${reviewsData.length ? reviewsData.map(r => `
                <div class="review-card">
                  <div class="review-header">
                    <span class="review-name">${r.name || 'Anónimo'}</span>
                    <span class="review-rating">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                  </div>
                  <p class="review-comment">${r.comment}</p>
                </div>
              `).join('') : '<p>Aún no hay reseñas para este producto.</p>'}
            </div>
            <div class="review-form">
              <h3>Dejá tu reseña</h3>
              <div class="rating-input" id="ratingInput">
                ${[1,2,3,4,5].map(i => `<button type="button" data-rating="${i}" aria-label="Calificación ${i} estrellas">★</button>`).join('')}
              </div>
              <textarea id="reviewComment" placeholder="Tu opinión..." rows="3"></textarea>
              <button class="btn-primary" style="margin-top:0.5rem;" onclick="submitReview(${productId})">Enviar reseña</button>
            </div>
          </div>
         `;
         let selectedRating = 0;
         const thumbs = document.querySelectorAll('#productThumbs img');
         if (thumbs.length) {
           thumbs.forEach((t, i) => {
             if (i === 0) t.classList.add('active');
             t.addEventListener('click', () => {
               const main = document.getElementById('productMainImage');
               if (!main) return;
               main.src = t.src;
               thumbs.forEach(tb => tb.classList.remove('active'));
               t.classList.add('active');
             });
           });
         }
        document.querySelectorAll('#ratingInput button').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedRating = Number(btn.dataset.rating);
            document.querySelectorAll('#ratingInput button').forEach(b => {
              b.classList.toggle('active', Number(b.dataset.rating) <= selectedRating);
            });
          });
        });
        window.submitReview = async (id) => {
          const comment = document.getElementById('reviewComment').value.trim();
          if (!selectedRating || !comment) {
            showToast('', 'Completá la calificación y el comentario', 'error');
            return;
          }
           try {
             const res = await window.fetchWithRetry(`${CONFIG.API.BASE}/api/products/${id}/reviews`, {
               method: 'POST',
               headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify({ rating: selectedRating, comment })
             }, 2, 1000);
             if (!res) throw new Error('Error de red');
             if (res.ok) {
               showToast('', '¡Reseña enviada! Gracias.', 'success');
               location.reload();
             } else {
              showToast('', 'Error al enviar la reseña', 'error');
            }
          } catch (error) {
            console.error(error);
            showToast('', window.getFetchErrorMessage(error) || 'Error de conexión. Intentá nuevamente.', 'error');
          }
        };
      } catch (err) {
        container.innerHTML = '<p>Error al cargar el producto.</p>';
      }
    }
    document.addEventListener('DOMContentLoaded', loadProduct);
  </script>
</body>
</html>
