      <div id="transferAliasSection" class="transfer-alias-section" style="display:none; margin-top:1.5rem; padding:1.5rem; background:var(--bg-secondary, #f8fafc); border-radius:var(--radius-md); border:1px solid var(--border, #e2e8f0);">

  <script src="../js/config.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      document.querySelectorAll('.reveal').forEach(el=>el.classList.add('visible'));
      loadSuccessAlias();
    });

    async function loadSuccessAlias(){
      try{
        const res = await window.fetchWithRetry(`${CONFIG.API.BASE}/api/payment-config`, {}, 2, 1000);
        if(!res) return;
        const data = await res.json();
        const alias = data.transferAlias || 'iara-salgueiro';
        const section = document.getElementById('transferAliasSection');
        const aliasEl = document.getElementById('successTransferAlias');
        const noteEl = document.getElementById('successTransferNote');
        if(section) section.style.display = 'block';
        if(aliasEl) aliasEl.textContent = alias;
        if(noteEl && data.message) noteEl.textContent = data.message;
      }catch(e){
        const section = document.getElementById('transferAliasSection');
        if(section) section.style.display = 'block';
      }
    }

    document.addEventListener('click', function(e){
      if(e.target && e.target.id === 'copySuccessAliasBtn'){
        const alias = document.getElementById('successTransferAlias')?.textContent;
        if(!alias) return;
        navigator.clipboard.writeText(alias).then(()=>{
          e.target.textContent = 'âœ\ Copyado';
          setTimeout(()=>{ e.target.textContent = 'âŸ¨ Copiar'; }, 2000);
        }).catch(()=>{});
      }
    });
  </script>
