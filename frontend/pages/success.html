<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago aprobado | Artesanía Gualeguay</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />

  <style>
    .wrap{max-width:900px;margin:0 auto;padding:7rem 1.5rem;}
    .card{background:var(--white);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:2.5rem;}
    .ok{font-size:4rem;}
    p{color:var(--text-muted);margin-top:0.8rem;}
    .actions{display:flex;gap:1rem;flex-wrap:wrap;margin-top:2rem;}
  </style>
</head>
  <body>
  <!-- ============== NAVBAR =============== -->
  <nav class="navbar" id="navbar">
    <div class="navbar-container">
      <div class="navbar-brand">
        <a href="../index.html" class="logo">
          <span class="logo-dot" aria-hidden="true"></span>
          <span class="logo-text">Artesanía Gualeguay</span>
        </a>
      </div>

      <a href="../index.html" class="nav-back" aria-label="Volver al inicio">← Volver al inicio</a>

      <div class="navbar-actions">
        <button id="themeToggle" class="theme-toggle" title="Cambiar tema" aria-label="Alternar modo claro/oscuro" aria-pressed="false">
          <span class="theme-icon theme-icon-sun" aria-hidden="true">☀️</span>
          <span class="theme-icon theme-icon-moon" aria-hidden="true">🌙</span>
        </button>
        <a href="wishlist.html" class="wishlist-link" aria-label="Favoritos">
          <span class="wishlist-icon" aria-hidden="true">❤️</span>
          <span class="wishlist-count" id="wishlistCount">0</span>
        </a>
        <a href="admin.html" class="admin-link" aria-label="Panel de Administración" title="Panel de Admin">
          <span class="admin-icon" aria-hidden="true">🐰</span>
        </a>
        <a href="../pages/cart.html" class="cart-link" aria-label="Carrito">
          <span class="cart-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          </span>
          <span class="cart-count" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </nav>
    <div class="wrap">
    <div class="card reveal visible">
      <div class="ok" aria-hidden="true">✅</div>
      <h1 style="margin-top:1rem;">¡Pago aprobado!</h1>
      <p>Gracias por tu compra en Artesanía Gualeguay. Te contactaremos si necesitamos coordinar algún detalle.</p>
      <div class="actions">
  <a class="btn-primary" href="../index.html">Volver al inicio</a>
  <a class="btn-secondary" style="text-decoration:none;padding:14px 24px;border-radius:var(--radius-xl);border:2px solid var(--rose-light);color:var(--rose-dark);font-weight:600;" href="../pages/cart.html">Ver carrito</a>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      document.querySelectorAll('.reveal').forEach(el=>el.classList.add('visible'));
    });
  </script>
</body>
</html>
