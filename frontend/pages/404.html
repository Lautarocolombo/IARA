<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | Artesanía Gualeguay</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <style>
    .error-wrap { max-width: 600px; margin: 0 auto; padding: 120px 24px 40px; text-align: center; }
    .error-code { font-family: 'Playfair Display', serif; font-size: 6rem; color: var(--rose); font-weight: 700; line-height: 1; }
    .error-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--text-dark); margin: 1rem 0 0.5rem; }
    .error-desc { color: var(--text-muted); margin-bottom: 2rem; }
    .error-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .error-actions a { min-width: 160px; text-align: center; }
  </style>
</head>
<body>
  <!-- ============== NAVBAR =============== -->
  <nav class="navbar" id="navbar">
    <div class="navbar-container">
      <div class="navbar-brand">
        <a href="../index.html" class="logo">
          <span class="logo-dot" aria-hidden="true"></span>
          <span class="logo-text">Artesanía Gualeguay</span>
        </a>
      </div>

      <a href="../index.html" class="nav-back" aria-label="Volver al inicio">← Volver al inicio</a>

      <div class="navbar-actions">
        <button id="themeToggle" class="theme-toggle" title="Cambiar tema" aria-label="Alternar modo claro/oscuro" aria-pressed="false">
          <span class="theme-icon theme-icon-sun" aria-hidden="true">☀️</span>
          <span class="theme-icon theme-icon-moon" aria-hidden="true">🌙</span>
        </button>
        <a href="wishlist.html" class="wishlist-link" aria-label="Favoritos">
          <span class="wishlist-icon" aria-hidden="true">❤️</span>
          <span class="wishlist-count" id="wishlistCount">0</span>
        </a>
        <a href="admin.html" class="admin-link" aria-label="Panel de Administración" title="Panel de Admin">
          <span class="admin-icon" aria-hidden="true">🐰</span>
        </a>
        <a href="../pages/cart.html" class="cart-link" aria-label="Carrito">
          <span class="cart-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          </span>
          <span class="cart-count" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </nav>

  <div class="error-wrap reveal visible">
    <div class="error-code">404</div>
    <h1 class="error-title">Página no encontrada</h1>
    <p class="error-desc">La página que estás buscando no existe o fue movida.</p>
    <div class="error-actions">
      <a href="../index.html" class="btn-primary">Volver al inicio</a>
      <a href="../index.html#catalog" class="btn-outline">Ver catálogo</a>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/ui.js"></script>

</body>
</html>
