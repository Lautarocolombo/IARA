<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - Artesanía Gualeguay</title>
  <link rel="canonical" href="https://iara-ivory.vercel.app/pages/forgot-password.html" />
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="../index.html" class="logo">
        <span class="logo-icon">📿</span>
        <span class="logo-text">Artesanía Gualeguay</span>
      </a>
    </nav>
  </header>

  <main class="main">
    <div class="container">
      <div class="auth-card">
        <h1 class="auth-title">Recuperar contraseña</h1>
        <p class="auth-subtitle" id="step1Text">Ingresá tu email y te enviaremos un enlace para restablecer tu contraseña.</p>

        <form id="forgotForm" class="auth-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="tu@email.com" required autocomplete="email">
            <span class="error" id="error-email"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Enviar enlace</button>
        </form>

        <div id="step2" class="auth-form" style="display:none;">
          <p class="auth-subtitle">Ingresá tu nueva contraseña.</p>
          <div class="form-group">
            <label for="newPassword">Nueva contraseña</label>
            <input type="password" id="newPassword" name="newPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
            <span class="error" id="error-newPassword"></span>
          </div>
          <button type="button" class="btn btn-primary btn-full" id="resetBtn">Restablecer contraseña</button>
        </div>

        <p class="auth-footer">
          <a href="../index.html">Volver al inicio</a>
        </p>
      </div>
    </div>
  </main>

  <script>
    (function() {
      'use strict';

      const API_BASE = window.CONFIG?.API?.BASE || '';
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      const forgotForm = document.getElementById('forgotForm');
      const step2 = document.getElementById('step2');
      const step1Text = document.getElementById('step1Text');
      const emailInput = document.getElementById('email');
      const newPasswordInput = document.getElementById('newPassword');
      const submitBtn = document.getElementById('submitBtn');
      const resetBtn = document.getElementById('resetBtn');

      function showError(fieldId, message) {
        const el = document.getElementById('error-' + fieldId);
        if (el) el.textContent = message || '';
      }

      function validateEmail(email) {
        if (!email.trim()) return 'Ingresá tu email';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) return 'Ingresá un email válido';
        return '';
      }

      if (token) {
        forgotForm.style.display = 'none';
        step2.style.display = 'block';
        step1Text.textContent = 'Completá el formulario para restablecer tu contraseña.';
      }

      forgotForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        showError('email', validateEmail(emailInput.value));
        if (validateEmail(emailInput.value)) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Enviando...';

        try {
          const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailInput.value.trim() })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Error al enviar el email');

          step1Text.textContent = 'Si el email existe, recibirás un enlace de recuperación. Verificá tu casilla de correo.';
          forgotForm.reset();
        } catch (err) {
          showError('email', 'Error al enviar el email. Intentá nuevamente.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Enviar enlace';
        }
      });

      resetBtn.addEventListener('click', async () => {
        showError('newPassword', '');
        if (!newPasswordInput.value || newPasswordInput.value.length < 6) {
          showError('newPassword', 'La contraseña debe tener al menos 6 caracteres');
          return;
        }

        resetBtn.disabled = true;
        resetBtn.textContent = 'Restableciendo...';

        try {
          const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword: newPasswordInput.value })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Error al restablecer contraseña');

          window.location.href = '../index.html?reset=success';
        } catch (err) {
          showError('newPassword', 'Error al restablecer contraseña. Intentá nuevamente.');
        } finally {
          resetBtn.disabled = false;
          resetBtn.textContent = 'Restablecer contraseña';
        }
      });
    })();
  </script>
</body>
</html>
